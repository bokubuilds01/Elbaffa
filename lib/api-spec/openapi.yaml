openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: El BAFFA sales and inventory API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: rooms
  - name: orders
  - name: products
  - name: sales
  - name: reports
  - name: users
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List the 11 fixed rooms
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
  /rooms/{roomId}/orders:
    post:
      operationId: openRoomOrder
      tags: [orders]
      summary: Open an order for a room
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "201":
          description: Open order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order with items
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}/items:
    post:
      operationId: addOrderItem
      tags: [orders]
      summary: Add or increment a product in an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}/items/{itemId}:
    patch:
      operationId: updateOrderItem
      tags: [orders]
      summary: Change item quantity
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: removeOrderItem
      tags: [orders]
      summary: Remove item from order
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}/close:
    post:
      operationId: closeOrder
      tags: [orders]
      summary: Close order, create sale and deduct stock transactionally
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Closed order and invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Search and list products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Deleted
  /inventory:
    get:
      operationId: listInventory
      tags: [products]
      summary: Current inventory
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryRow"
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: Sales history
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
  /sales/{saleId}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Sale and invoice details
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: Sales reports and aggregates
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reports"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Users for admin management
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: number }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: number }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: number }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: number }
    SaleId:
      name: saleId
      in: path
      required: true
      schema: { type: number }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Room:
      type: object
      required: [id, name, status, total]
      properties:
        id: { type: number }
        name: { type: string }
        status: { type: string, enum: [available, open] }
        total: { type: number }
        orderId: { type: ["number", "null"] }
    Product:
      type: object
      required: [id, name, barcode, sellingPrice, costPrice, stock, category, lowStockLimit]
      properties:
        id: { type: number }
        name: { type: string }
        barcode: { type: string }
        sellingPrice: { type: number }
        costPrice: { type: number }
        stock: { type: number }
        category: { type: string }
        image: { type: ["string", "null"] }
        lowStockLimit: { type: number }
    ProductInput:
      type: object
      required: [name, barcode, sellingPrice, costPrice, stock, category, lowStockLimit]
      properties:
        name: { type: string, minLength: 1 }
        barcode: { type: string, minLength: 1 }
        sellingPrice: { type: number, minimum: 0 }
        costPrice: { type: number, minimum: 0 }
        stock: { type: number, minimum: 0 }
        category: { type: string }
        image: { type: string }
        lowStockLimit: { type: number, minimum: 0 }
    ProductUpdate:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: number }
        quantity: { type: number, minimum: 1 }
    OrderItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: number, minimum: 1 }
    OrderItem:
      type: object
      required: [id, productId, name, quantity, unitPrice, total]
      properties:
        id: { type: number }
        productId: { type: number }
        name: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        total: { type: number }
    Order:
      type: object
      required: [id, roomId, roomName, status, total, items, createdAt]
      properties:
        id: { type: number }
        roomId: { type: number }
        roomName: { type: string }
        status: { type: string, enum: [open, closed, cancelled] }
        total: { type: number }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        createdAt: { type: string, format: date-time }
        closedAt: { type: ["string", "null"], format: date-time }
    Invoice:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [invoiceNumber, employee]
          properties:
            invoiceNumber: { type: string }
            employee: { type: string }
    InventoryRow:
      type: object
      required: [productId, name, barcode, stock, sellingPrice, lowStockLimit, status]
      properties:
        productId: { type: number }
        name: { type: string }
        barcode: { type: string }
        stock: { type: number }
        sellingPrice: { type: number }
        lowStockLimit: { type: number }
        status: { type: string, enum: [good, low, out] }
    Sale:
      type: object
      required: [id, invoiceNumber, room, employee, date, time, total]
      properties:
        id: { type: number }
        invoiceNumber: { type: string }
        room: { type: string }
        employee: { type: string }
        date: { type: string }
        time: { type: string }
        total: { type: number }
    Dashboard:
      type: object
      required: [todaySales, todayOrders, todayItems, lowStockCount, monthSales, rooms]
      properties:
        todaySales: { type: number }
        todayOrders: { type: number }
        todayItems: { type: number }
        lowStockCount: { type: number }
        monthSales: { type: number }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
    Reports:
      type: object
      required: [today, yesterday, week, month, totalItems, totalRevenue, byRoom, byEmployee, topProducts]
      properties:
        today: { type: number }
        yesterday: { type: number }
        week: { type: number }
        month: { type: number }
        totalItems: { type: number }
        totalRevenue: { type: number }
        byRoom:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: number }
        byEmployee:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: number }
        topProducts:
          type: array
          items:
            type: object
            required: [label, quantity]
            properties:
              label: { type: string }
              quantity: { type: number }
    User:
      type: object
      required: [id, name, email, role, active]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, employee] }
        active: { type: boolean }

