kind = "web"
previewPath = "/"
title = "El BAFFA"
description = "A professional Arabic RTL sales and inventory management web app for 11 fixed rooms, with secure authentication, role-based access, product ordering, barcode keyboard scanner support, invoicing, sales history, stock control, and reports."
version = "1.0.0"
id = "artifacts/el-baffa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18468

[services.development]
run = "pnpm --filter @workspace/el-baffa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/el-baffa", "run", "build" ]
serve = "static"
publicDir = "artifacts/el-baffa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18468"
BASE_PATH = "/"
